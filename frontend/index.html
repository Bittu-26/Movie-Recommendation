<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Movie Recommendation App</title>

    <style>
      :root {
        --bg: #0f172a;
        --card: #111827;
        --primary: #6366f1;
        --primary-hover: #4f46e5;
        --text: #e5e7eb;
        --muted: #9ca3af;
        --border: #1f2933;
      }

      * {
        box-sizing: border-box;
        margin: 0;
        padding: 0;
        font-family: system-ui, -apple-system, BlinkMacSystemFont,
          "Segoe UI", Roboto, Oxygen, Ubuntu, Cantarell, "Open Sans",
          "Helvetica Neue", sans-serif;
      }

      body {
        min-height: 100vh;
        background: linear-gradient(135deg, #020617, #0f172a);
        display: flex;
        align-items: center;
        justify-content: center;
        color: var(--text);
      }

      .container {
        width: 100%;
        max-width: 520px;
        padding: 24px;
      }

      .card {
        background: rgba(17, 24, 39, 0.85);
        backdrop-filter: blur(14px);
        border: 1px solid var(--border);
        border-radius: 18px;
        padding: 28px;
        box-shadow: 0 20px 40px rgba(0, 0, 0, 0.4);
      }

      .header {
        text-align: center;
        margin-bottom: 22px;
      }

      .header h1 {
        font-size: 1.8rem;
        font-weight: 700;
        margin-bottom: 8px;
        color: #ffffff;
      }

      .header p {
        font-size: 0.95rem;
        color: var(--muted);
      }

      .input-group {
        margin-top: 22px;
      }

      textarea {
        width: 100%;
        min-height: 90px;
        padding: 14px 16px;
        border-radius: 12px;
        border: 1px solid var(--border);
        background: #020617;
        color: var(--text);
        resize: none;
        font-size: 0.95rem;
        outline: none;
        transition: border 0.2s;
      }

      textarea:focus {
        border-color: var(--primary);
      }

      .btn {
        width: 100%;
        margin-top: 18px;
        padding: 14px;
        font-size: 0.95rem;
        font-weight: 600;
        border-radius: 12px;
        border: none;
        background: var(--primary);
        color: #ffffff;
        cursor: pointer;
        transition: background 0.2s, transform 0.1s;
      }

      .btn:hover {
        background: var(--primary-hover);
      }

      .btn:active {
        transform: scale(0.98);
      }

      .results {
        margin-top: 26px;
      }

      .results h3 {
        font-size: 1rem;
        margin-bottom: 12px;
        color: #ffffff;
      }

      .movie-list {
        list-style: none;
        display: grid;
        gap: 10px;
      }

      .movie {
        padding: 12px 14px;
        border-radius: 10px;
        background: #020617;
        border: 1px solid var(--border);
        font-size: 0.95rem;
        transition: transform 0.15s, border 0.15s;
      }

      .movie:hover {
        transform: translateY(-2px);
        border-color: var(--primary);
      }

      .footer {
        text-align: center;
        margin-top: 18px;
        font-size: 0.75rem;
        color: var(--muted);
      }

      @media (max-width: 480px) {
        .card {
          padding: 22px;
        }

        .header h1 {
          font-size: 1.5rem;
        }
      }
    </style>
  </head>

  <body>
    <div class="container">
      <div class="card">
        <div class="header">
          <h1>🎬 Movie Recommender</h1>
          <p>Describe what you feel like watching</p>
        </div>

        <div class="input-group">
          <textarea
            placeholder="Example: Action movies with a strong female lead..."
          ></textarea>
          <button class="btn">Get Recommendations</button>
        </div>

        <div class="results">
          <h3>Recommended Movies</h3>
          <ul class="movie-list">
            <li class="movie">Interstellar</li>
            <li class="movie">Inception</li>
            <li class="movie">Mad Max: Fury Road</li>
          </ul>
        </div>
      </div>

      <div class="footer">
        Powered by AI • Built with React & Fastify
      </div>
    </div>

    <!-- React entry -->
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
